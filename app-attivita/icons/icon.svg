<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona di Aura Tasks. Le PNG in questa cartella derivano da qui
       (maskable e apple-touch-icon: stesso disegno con rx="0", cioè senza angoli arrotondati). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#3d24c2"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0.88" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#38d6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="0.1" cy="0.94" r="0.6">
      <stop offset="0" stop-color="#ff70be" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff70be" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e3ff"/>
    </radialGradient>
    <clipPath id="shape"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow-cyan)"/>
    <rect width="512" height="512" fill="url(#glow-pink)"/>
  </g>
  <circle cx="256" cy="256" r="172" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="256" cy="256" r="138" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="256" cy="256" r="104" fill="url(#orb)"/>
  <path d="M208 259l33 33 63-68" fill="none" stroke="#5636e0" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
